<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SignApp - Abecedario</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="bg-gray-50 text-gray-800">
    <div class="flex min-h-screen">

        <aside id="sidebar" class="w-56 bg-white border-r border-gray-200 flex flex-col fixed h-full"></aside>

        <main class="ml-56 flex-1 p-8">
            <h1 class="text-2xl font-bold mb-6">Aprende el Abecedario</h1>

            <div class="grid grid-cols-2 gap-5">
                <!-- Cámara -->
                <div
                    class="bg-white rounded-xl border border-gray-200 p-3 relative min-h-[400px] flex items-center justify-center">
                    <img id="video-stream" src="http://127.0.0.1:5000/api/video_feed" alt="Video"
                        class="w-full rounded-lg scale-x-[-1]">
                    <div
                        class="absolute bottom-3 left-1/2 -translate-x-1/2 bg-white border border-gray-200 shadow rounded-full px-4 py-1.5 flex items-center gap-2">
                        <span class="text-xs font-bold uppercase text-gray-400">Detectando:</span>
                        <strong id="gesture-display" class="text-indigo-600 font-extrabold text-sm">...</strong>
                    </div>
                </div>

                <!-- Imagen abecedario -->
                <div class="bg-white rounded-xl border border-gray-200 p-5 flex flex-col gap-3">
                    <h2 class="text-lg font-bold text-gray-800">Letras del Abecedario</h2>
                    <p class="text-sm text-gray-400">Imita las señas con tu mano</p>
                    <div class="overflow-y-auto rounded-lg border border-gray-100" style="max-height: 460px;">
                        <img src="assets/img.jpg" alt="Abecedario completo" class="w-full h-auto rounded-lg">
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="components/sidebar.js"></script>
    <script src="js/script.js"></script>
    <script>
        loadSidebar('abecedario');
        setMode('words');
    </script>
</body>

</html>
