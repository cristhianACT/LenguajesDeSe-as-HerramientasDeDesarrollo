<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SignApp - Admin Incidencias</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="bg-gray-50 text-gray-800">
    <div class="flex min-h-screen">
        <aside id="sidebar" class="w-56 bg-white border-r border-gray-200 flex flex-col fixed h-full"></aside>

        <main class="ml-56 flex-1 p-8">
            <div class="bg-white rounded-xl border border-gray-200 p-6 shadow-sm">
                <div class="flex justify-between items-center mb-6">
                    <h1 class="text-2xl font-bold">Panel de Incidencias</h1>
                    <button id="btn-refresh"
                        class="bg-gray-100 hover:bg-gray-200 text-gray-700 py-2 px-4 rounded-lg text-sm font-semibold transition">
                        Actualizar
                    </button>
                </div>

                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr
                                class="bg-gray-50 text-gray-500 uppercase text-xs tracking-wider border-b border-gray-200">
                                <th class="p-4 font-bold">ID</th>
                                <th class="p-4 font-bold">Fecha</th>
                                <th class="p-4 font-bold">Tipo</th>
                                <th class="p-4 font-bold">Descripción</th>
                                <th class="p-4 font-bold">Estado</th>
                                <th class="p-4 font-bold">Acción</th>
                            </tr>
                        </thead>
                        <tbody id="incidencias-tbody" class="divide-y divide-gray-100 text-sm">
                            <tr>
                                <td colspan="6" class="p-4 text-center text-gray-400 italic">Cargando incidencias...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script src="components/sidebar.js"></script>
    <script src="js/admin_incidencias.js"></script>
    <script>
        // Use an empty or different active state if 'admin' is not in sidebar, but we can just call loadSidebar without a matching ID to keep the base structure.
        loadSidebar('');
    </script>
</body>

</html>
