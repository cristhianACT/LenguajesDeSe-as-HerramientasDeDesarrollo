<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SignApp - Iniciar Sesión</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
            background-image: radial-gradient(#e5e7eb 1px, transparent 1px);
            background-size: 20px 20px;
        }
    </style>
</head>

<body class="flex items-center justify-center min-h-screen">

    <div class="bg-white p-8 rounded-2xl shadow-xl border border-gray-100 w-full max-w-md relative overflow-hidden">
        <div class="absolute top-0 left-0 w-full h-2 bg-indigo-600"></div>

        <div class="text-center mb-8">
            <h1 class="text-3xl font-black text-indigo-700 tracking-tight">SignApp</h1>
            <p class="text-gray-500 text-sm mt-1" id="form-subtitle">Ingresa a tu cuenta para continuar</p>
        </div>

        <div id="error-message"
            class="hidden mb-4 p-3 bg-red-50 border border-red-200 text-red-600 rounded-lg text-sm font-medium text-center">
        </div>
        <div id="success-message"
            class="hidden mb-4 p-3 bg-green-50 border border-green-200 text-green-600 rounded-lg text-sm font-medium text-center">
        </div>

        <form id="auth-form" class="flex flex-col gap-4">
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-1">Correo Electrónico</label>
                <input type="email" id="email" required
                    class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-indigo-600 focus:border-indigo-600 transition"
                    placeholder="ejemplo@correo.com">
            </div>

            <div>
                <label class="block text-sm font-bold text-gray-700 mb-1">Contraseña</label>
                <input type="password" id="password" required
                    class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-indigo-600 focus:border-indigo-600 transition"
                    placeholder="••••••••">
            </div>

            <button type="submit" id="btn-submit"
                class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-lg transition shadow-lg mt-2">
                Iniciar Sesión
            </button>
        </form>

        <div class="mt-6 text-center">
            <p class="text-sm text-gray-600">
                <span id="toggle-text">¿No tienes cuenta?</span>
                <button id="btn-toggle" class="text-indigo-600 font-bold hover:underline ml-1">Regístrate aquí</button>
            </p>
        </div>
    </div>

    <script src="js/login.js"></script>
</body>

</html>
